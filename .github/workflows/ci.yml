name: CI

on:
  push:
    branches: [main, login_system]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go.sum

      - name: Install GCC (CGO required for SQLite)
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Download dependencies
        run: go mod download

      - name: go.mod hygiene
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are out of date — run 'go mod tidy' and commit"
            exit 1
          fi

      - name: Build
        run: go build -v ./cmd/server

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./internal/... -v -coverprofile=coverage.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.txt
          retention-days: 7

      - name: Test summary
        if: always()
        run: |
          set -o pipefail
          go tool cover -func=coverage.txt | tail -1 | tee "$GITHUB_STEP_SUMMARY"
