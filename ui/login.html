<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SME-Shield — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cocoa:  #200f0a;
  --plum:   #2b2538;
  --cream:  #fcfaf9;
  --sand:   #e3ccc0;
  --stone:  #a69f9d;
  --mint:   #a2f6f5;
  --iris:   #858df9;
  --red:    #f87171;
  --font:   'Inter',ui-sans-serif,system-ui,sans-serif;
  --mono:   'JetBrains Mono',ui-monospace,monospace;
  --ease:   cubic-bezier(0.16,1,0.3,1);
}
html{height:100%}
body{
  background:var(--cocoa);color:var(--cream);
  font-family:var(--font);font-size:15px;
  line-height:1.5;min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;
}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:4px}

/* ── Background grid ────────────────────────────────────────────── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(227,204,192,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(227,204,192,0.04) 1px, transparent 1px);
  background-size:48px 48px;
  pointer-events:none;
}

/* ── Card ───────────────────────────────────────────────────────── */
.card{
  position:relative;z-index:1;
  background:var(--plum);
  border:1px solid rgba(227,204,192,0.12);
  border-radius:8px;
  padding:40px;
  width:100%;max-width:400px;
  animation:cardIn 0.6s var(--ease) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(20px) scale(0.98)}
  to  {opacity:1;transform:translateY(0)    scale(1)}
}

/* ── Logo ───────────────────────────────────────────────────────── */
.logo{
  display:flex;align-items:center;gap:10px;
  margin-bottom:32px;
}
.logo-mark{
  width:32px;height:32px;border-radius:7px;
  border:1px solid rgba(227,204,192,0.2);
  display:flex;align-items:center;justify-content:center;
  background:rgba(162,246,245,0.06);
}
.logo-name{font-size:14px;font-weight:500;letter-spacing:0.04em;color:var(--cream)}
.logo-sub{font-size:11px;color:var(--stone);margin-left:4px}

/* ── Heading ────────────────────────────────────────────────────── */
.heading{
  font-size:24px;font-weight:300;
  letter-spacing:-0.01em;color:var(--cream);
  margin-bottom:6px;
}
.heading .mint{color:var(--mint)}
.subheading{
  font-size:13px;font-weight:300;color:var(--stone);
  margin-bottom:32px;line-height:1.6;
}

/* ── Form ───────────────────────────────────────────────────────── */
.field{margin-bottom:16px}
.field label{
  display:block;font-size:11px;font-weight:500;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--stone);margin-bottom:8px;
}
.field input{
  font-family:var(--font);font-size:14px;
  color:var(--cream);background:var(--cocoa);
  border:1px solid rgba(227,204,192,0.18);
  border-radius:4px;padding:11px 14px;
  outline:none;width:100%;
  transition:border-color 0.15s,box-shadow 0.15s;
}
.field input::placeholder{color:var(--stone);opacity:0.6}
.field input:focus{
  border-color:var(--mint);
  box-shadow:0 0 0 3px rgba(162,246,245,0.08);
}

/* ── Error state ────────────────────────────────────────────────── */
.error-banner{
  display:flex;align-items:center;gap:10px;
  background:rgba(248,113,113,0.08);
  border:1px solid rgba(248,113,113,0.25);
  border-radius:6px;padding:11px 14px;
  margin-bottom:20px;
  animation:shake 0.4s var(--ease);
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%    {transform:translateX(-6px)}
  40%    {transform:translateX(6px)}
  60%    {transform:translateX(-4px)}
  80%    {transform:translateX(4px)}
}
.error-icon{
  width:16px;height:16px;border-radius:50%;
  background:rgba(248,113,113,0.2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.error-text{font-size:13px;color:var(--red)}

/* ── Submit button ──────────────────────────────────────────────── */
.btn-submit{
  font-family:var(--font);font-size:14px;font-weight:500;
  color:var(--cocoa);background:var(--mint);
  border:none;border-radius:9999px;
  padding:13px 0;width:100%;cursor:pointer;
  margin-top:8px;
  transition:opacity 0.15s,transform 0.1s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-submit:hover{opacity:0.88;transform:translateY(-1px)}
.btn-submit:active{transform:translateY(0)}
.btn-submit:disabled{opacity:0.4;cursor:not-allowed;transform:none}

/* ── Spinner ────────────────────────────────────────────────────── */
.spinner{
  width:14px;height:14px;border-radius:50%;
  border:2px solid rgba(32,15,10,0.3);
  border-top-color:var(--cocoa);
  animation:spin 0.7s linear infinite;
  display:none;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Footer note ────────────────────────────────────────────────── */
.card-footer{
  margin-top:28px;padding-top:20px;
  border-top:1px solid rgba(227,204,192,0.08);
  display:flex;align-items:center;justify-content:space-between;
}
.card-footer a{
  font-size:12px;color:var(--stone);text-decoration:none;
  transition:color 0.15s;
}
.card-footer a:hover{color:var(--cream)}
.card-footer .hint{
  font-family:var(--mono);font-size:11px;
  color:var(--stone);letter-spacing:0.04em;
  display:flex;align-items:center;gap:6px;
}
.hint-dot{
  width:5px;height:5px;border-radius:50%;background:var(--mint);
  box-shadow:0 0 6px rgba(162,246,245,0.5);
}
</style>
</head>
<body>

<div class="card" role="main">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 1L2 3.5V7.5C2 11 4.5 14.2 8 15C11.5 14.2 14 11 14 7.5V3.5L8 1Z"
          stroke="#fcfaf9" stroke-width="1.1" fill="none"/>
        <path d="M5.5 7.5l2 2 3-3" stroke="#fcfaf9"
          stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="logo-name">SME-SHIELD</span>
    <span class="logo-sub">Network Auditor</span>
  </div>

  <!-- Heading -->
  <h1 class="heading">
    Welcome <span class="mint">back</span>
  </h1>
  <p class="subheading">
    Sign in to access your network security dashboard.
  </p>

  <!-- Error banner — shown when ?error=1 is in the URL -->
  <div id="error-banner" class="error-banner" style="display:none"
    role="alert" aria-live="assertive">
    <div class="error-icon" aria-hidden="true">
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
        <path d="M4 2v3M4 6.5v.5" stroke="#f87171" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="error-text">Incorrect username or password. Please try again.</p>
  </div>

  <!-- Login form -->
  <form id="login-form" method="POST" action="/login" novalidate>

    <div class="field">
      <label for="username">Username</label>
      <input
        id="username" name="username" type="text"
        placeholder="Enter your username"
        autocomplete="username"
        required autofocus/>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password" name="password" type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required/>
    </div>

    <button type="submit" class="btn-submit" id="btn-submit">
      <span class="spinner" id="spinner" aria-hidden="true"></span>
      <span id="btn-text">Sign in</span>
    </button>

  </form>

  <!-- Footer -->
  <div class="card-footer">
    <a href="/landing.html">← Back to home</a>
    <span class="hint">
      <span class="hint-dot" aria-hidden="true"></span>
      Secure session
    </span>
  </div>

</div>

<script>
// Show error banner if redirected back with ?error=1
(function(){
  if(new URLSearchParams(location.search).get('error') === '1'){
    document.getElementById('error-banner').style.display = 'flex';
    // Shake the password field too
    const pwd = document.getElementById('password');
    pwd.style.borderColor = 'rgba(248,113,113,0.5)';
    pwd.focus();
  }
})();

// Show spinner on submit
document.getElementById('login-form').addEventListener('submit', function(){
  const btn     = document.getElementById('btn-submit');
  const spinner = document.getElementById('spinner');
  const text    = document.getElementById('btn-text');
  btn.disabled        = true;
  spinner.style.display = 'block';
  text.textContent    = 'Signing in...';
});
</script>
</body>
</html>
