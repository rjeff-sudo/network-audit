server:
  port: 8080
  ui_dir: "./ui"
  db_path: "./data/audit.db"

auth:
  # Username and password are now set via the /setup page on first run.
  # Only the session secret lives here — change it to a long random string.
  # Generate one with: openssl rand -hex 32
  session_secret: "12345678"
  session_ttl_hours: 168

scanner:
  worker_count: 100
  timeout_ms: 500
  banner_timeout_ms: 2000
  ports:
    - 21
    - 22
    - 23
    - 25
    - 53
    - 80
    - 110
    - 135
    - 139
    - 143
    - 443
    - 445
    - 993
    - 995
    - 1433
    - 3306
    - 3389
    - 5432
    - 5900
    - 6379
    - 8080
    - 8443
    - 27017

discovery:
  worker_count: 50
  timeout_ms: 200
  probe_ports:
    - 22
    - 80
    - 443
    - 445
    - 3306

nvd:
  api_key: ""
  base_url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
  cache_ttl_hours: 168
  request_delay_ms: 600